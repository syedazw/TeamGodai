    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var _fetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(val) {
                _fetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch(e) {
          try {
            var proto = Object.getPrototypeOf(window) || window;
            var _protoFetch = proto.fetch || window.fetch;
            Object.defineProperty(proto, 'fetch', {
              get: function() {
                return _protoFetch;
              },
              set: function(val) {
                _protoFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch(err) {
            console.warn('Failed to define fetch property:', err);
          }
        }
      })();
    </script>
  </head>

    <div id="root"></div>
